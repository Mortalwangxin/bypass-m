name: Build MTPlugin.dylib (诊断版)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build dylib (诊断版 - 无 hook)
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          clang -dynamiclib \
            -framework Foundation \
            -arch arm64 \
            -miphoneos-version-min=14.0 \
            -isysroot "$SDK" \
            -o MTPlugin.dylib \
            MTPlugin.m \
            -fobjc-arc \
            -Wno-deprecated-declarations

          codesign -f -s - MTPlugin.dylib || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MTPlugin
          path: MTPlugin.dylib
