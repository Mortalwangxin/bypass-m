name: Build MTPlugin.dylib

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build dylib
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          clang -dynamiclib \
            -framework Foundation \
            -framework UIKit \
            -framework WebKit \
            -arch arm64 \
            -miphoneos-version-min=14.0 \
            -isysroot "$SDK" \
            -o MTPlugin.dylib \
            MTPlugin_v5.c \
            -fobjc-arc \
            -Wno-deprecated-declarations

          # 签名
          codesign -f -s - MTPlugin.dylib || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MTPlugin
          path: MTPlugin.dylib
